name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ── 빌드 ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libgtest-dev build-essential

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build all targets
        run: cmake --build build --parallel

      - name: Upload compile_commands.json
        uses: actions/upload-artifact@v4
        with:
          name: compile-commands
          path: build/compile_commands.json

  # ── 단위 테스트 ────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libgtest-dev build-essential

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target rvc_tests --parallel

      - name: Run unit tests
        run: ./build/rvc_tests --gtest_output=xml:unit-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml

  # ── 시스템 테스트 ──────────────────────────────────────────────────────────
  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libgtest-dev build-essential

      - name: Configure & Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --target rvc_system_tests --parallel

      - name: Run system tests
        run: ./build/rvc_system_tests

  # ── cppcheck ──────────────────────────────────────────────────────────────
  cppcheck:
    name: cppcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update -qq && sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --std=c++17 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=useStlAlgorithm \
            --suppress=normalCheckLevelMaxBranches \
            --error-exitcode=1 \
            -I src \
            src/ \
            simulator/ \
            arch/system-tests/

  # ── clang-tidy ────────────────────────────────────────────────────────────
  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libgtest-dev build-essential clang clang-tidy

      - name: Configure (generate compile_commands.json)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy on src/
        run: |
          run-clang-tidy \
            -p build \
            -header-filter='^src/.*\.(hpp|h)$' \
            $(find src -name '*.cpp') \
            2>&1 | tee clang-tidy-report.txt
          # clang-tidy exits 0 even with warnings; check for errors explicitly
          if grep -q 'error:' clang-tidy-report.txt; then exit 1; fi

      - name: Upload clang-tidy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: clang-tidy-report.txt
